<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <title>My Bookings – PintoPin</title>
  <link rel="stylesheet" href="../css/style.css"/>
  <style>
    .history-wrap { max-width: 700px; margin: 40px auto; padding: 0 20px; }
    .booking-card {
      background: rgba(255,255,255,0.95);
      border-radius: 12px; padding: 20px;
      margin-bottom: 16px;
      box-shadow: 0 4px 16px rgba(0,0,0,0.08);
    }
    .booking-card h3 { margin-bottom: 8px; color: #1a1a2e; }
    .booking-card p  { color: #555; font-size: 14px; margin: 4px 0; }
    .badge {
      display: inline-block; padding: 4px 12px;
      border-radius: 20px; font-size: 12px;
      font-weight: 600; margin-bottom: 10px;
    }
    .badge-pending     { background: #fff3cd; color: #856404; }
    .badge-accepted    { background: #cfe2ff; color: #084298; }
    .badge-in_progress { background: #fff3cd; color: #856404; }
    .badge-completed   { background: #d1e7dd; color: #0f5132; }
    .badge-cancelled   { background: #f8d7da; color: #842029; }
    .rate-box {
      margin-top: 12px; padding-top: 12px;
      border-top: 1px solid #eee;
    }
    .page-title {
      text-align: center; padding: 30px 0 10px;
      color: white;
    }
    .empty {
      text-align: center; color: #666;
      padding: 60px 20px;
      background: rgba(255,255,255,0.95);
      border-radius: 12px;
    }
    .empty a { color: #e94560; text-decoration: none; }
    .status-pending     { color: #856404; }
    .status-accepted    { color: #084298; }
    .status-in_progress { color: #e94560; }
    .status-completed   { color: #0f5132; }
  </style>
</head>
<body class="page-bg-history">
  <nav class="navbar">
    <div class="logo">📍 PintoPin</div>
   <div class="nav-links">
  <a href="booking.html" style="color:white">+ New Booking</a>
  <a href="about.html" style="color:white">About</a>
  <a href="#" onclick="handleLogout()" style="color:#e94560">Logout</a>
</div>
  </nav>

  <div class="page-title">
    <h2>My Bookings 📋</h2>
    <p style="color:#ddd">Track all your rides</p>
  </div>

  <div class="history-wrap" id="historyList">
    <p class="empty">Loading your bookings...</p>
  </div>

  <script src="../js/auth.js"></script>
  <script src="../js/history.js"></script>
</body>
</html>
