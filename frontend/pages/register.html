<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <title>Register – PintoPin</title>
  <link rel="stylesheet" href="../css/style.css"/>
</head>
<body class="page-bg-login">
  <nav class="navbar">
    <div class="logo">📍 PintoPin</div>
    <div class="nav-links">
  <a href="../index.html">Home</a>
  <a href="about.html" style="color:white">About</a>
  <a href="login.html">Login</a>
</div>
  </nav>

  <div class="form-container">
    <h2>Create Account</h2>
    <div class="form-group">
      <label>Full Name</label>
      <input type="text" id="name" placeholder="Your name"/>
    </div>
    <div class="form-group">
      <label>Email</label>
      <input type="email" id="email" placeholder="you@email.com"/>
    </div>
    <div class="form-group">
      <label>Phone</label>
     <input type="tel" id="phone" 
  placeholder="9876543210"
  maxlength="10"
  minlength="10"
  pattern="[6-9][0-9]{9}"
  oninput="this.value=this.value.replace(/[^0-9]/g,'').slice(0,10)"/>
    </div>
    <div class="form-group">
      <label>Password</label>
      <input type="password" id="password" placeholder="••••••••"/>
    </div>
    <div class="form-group">
      <label>I am a</label>
      <select id="role">
        <option value="customer">Customer</option>
        <option value="driver">Driver</option>
      </select>
    </div>
    <button class="btn btn-primary btn-full" onclick="handleRegister()">Register</button>
    <div class="form-footer">
      Already have an account? <a href="login.html">Login</a>
    </div>
  </div>
  <script src="../js/auth.js"></script>
</body>
</html>
