<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <title>Forgot Password – PintoPin</title>
  <link rel="stylesheet" href="../css/style.css"/>
  <style>
    .otp-inputs {
      display: flex; gap: 10px;
      justify-content: center; margin: 16px 0;
    }
    .otp-inputs input {
      width: 48px; height: 52px;
      text-align: center; font-size: 22px;
      font-weight: bold; border: 2px solid #ddd;
      border-radius: 8px;
    }
    .otp-inputs input:focus {
      border-color: #e94560; outline: none;
    }
    .step { display: none; }
    .step.active { display: block; }
    .timer {
      text-align: center; color: #e94560;
      font-weight: 600; margin: 8px 0;
    }
    .resend-btn {
      background: none; border: none;
      color: #e94560; cursor: pointer;
      font-size: 14px; text-decoration: underline;
      display: block; margin: 8px auto;
    }
    .resend-btn:disabled { color: #aaa; cursor: not-allowed; }
  </style>
</head>
<body class="page-bg-login">
  <nav class="navbar">
    <div class="logo">📍 PintoPin</div>
    <div class="nav-links">
      <a href="login.html" style="color:white">Back to Login</a>
    </div>
  </nav>

  <div class="form-container">

    <!-- Step 1: Enter Email -->
    <div class="step active" id="step1">
      <h2>Forgot Password 🔐</h2>
      <p style="color:#666;margin-bottom:20px;text-align:center">
        Enter your email to receive an OTP
      </p>
      <div class="form-group">
        <label>Email Address</label>
        <input type="email" id="fpEmail" placeholder="your@email.com"/>
      </div>
      <button class="btn btn-primary btn-full"
        onclick="sendOTP()">
        Send OTP 📧
      </button>
      <div class="form-footer">
        Remember password? <a href="login.html">Login</a>
      </div>
    </div>

    <!-- Step 2: Enter OTP -->
    <div class="step" id="step2">
      <h2>Enter OTP 🔢</h2>
      <p style="color:#666;margin-bottom:8px;text-align:center">
        We sent a 6-digit OTP to
      </p>
      <p style="text-align:center;font-weight:600;color:#1a1a2e"
        id="emailDisplay"></p>

      <div class="otp-inputs">
        <input type="text" maxlength="1" id="otp1" oninput="moveToNext(this, 'otp2')"/>
        <input type="text" maxlength="1" id="otp2" oninput="moveToNext(this, 'otp3')"/>
        <input type="text" maxlength="1" id="otp3" oninput="moveToNext(this, 'otp4')"/>
        <input type="text" maxlength="1" id="otp4" oninput="moveToNext(this, 'otp5')"/>
        <input type="text" maxlength="1" id="otp5" oninput="moveToNext(this, 'otp6')"/>
        <input type="text" maxlength="1" id="otp6" oninput="moveToNext(this, null)"/>
      </div>

      <div class="timer" id="timer">OTP expires in: 5:00</div>
      <button class="resend-btn" id="resendBtn"
        onclick="sendOTP(true)" disabled>
        Resend OTP
      </button>

      <button class="btn btn-primary btn-full"
        onclick="verifyOTP()">
        Verify OTP ✅
      </button>
    </div>

    <!-- Step 3: New Password -->
    <div class="step" id="step3">
      <h2>New Password 🔑</h2>
      <p style="color:#666;margin-bottom:20px;text-align:center">
        Enter your new password
      </p>
      <div class="form-group">
        <label>New Password</label>
        <input type="password" id="newPassword" placeholder="••••••••"/>
      </div>
      <div class="form-group">
        <label>Confirm Password</label>
        <input type="password" id="confirmPassword" placeholder="••••••••"/>
      </div>
      <button class="btn btn-primary btn-full"
        onclick="resetPassword()">
        Reset Password 🔐
      </button>
    </div>

  </div>

  <script src="https://cdn.jsdelivr.net/npm/@emailjs/browser@3/dist/email.min.js"></script>
  <script src="../js/auth.js"></script>
  <script src="../js/email.js"></script>
  <script src="../js/forgot-password.js"></script>
</body>
</html>
